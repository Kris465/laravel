<VirtualHost *:8184>
    ServerName helamin.ru
    ServerAlias www.helamin.ru
    
    AddDefaultCharset utf-8
    ServerAdmin postmaster@helamin.ru
    DocumentRoot /home/helamin/helamin.ru/temp-laravel/public
    
    <Directory /home/helamin/helamin.ru/temp-laravel/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>
    
    <Directory /home/helamin/helamin.ru/temp-laravel>
        <FilesMatch \.(env|git|htaccess)$>
            Require all denied
        </FilesMatch>
    </Directory>
    
    <IfModule mod_setenvif.c>
        SetEnvIf X-Forwarded-Proto https HTTPS=on
        SetEnvIf X-Forwarded-Proto https=on HTTPS=on
    </IfModule>
    
    <IfModule mod_mime.c>
        AddHandler application/x-httpd-php .php
    </IfModule>
    
    <IfModule mod_dir.c>
        DirectoryIndex index.php index.html
    </IfModule>
    
    ErrorLog /var/log/httpd/helamin.ru.error_log
    CustomLog /var/log/httpd/helamin.ru.access_log combined
</VirtualHost>
